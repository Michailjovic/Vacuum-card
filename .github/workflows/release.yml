name: Release

# Triggers only when you manually create a release on GitHub.
# Pushing tags does NOT trigger this workflow.
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist file to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/roborock-vacuum-card.js
          fail_on_unmatched_files: true
